name: Build LineageOS Mainline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core \
            gnupg \
            flex \
            bison \
            gperf \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            python3

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init source
        run: |
          mkdir lineage
          cd lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.0

      - name: Sync source
        run: |
          cd lineage
          repo sync -c --no-clone-bundle --no-tags -j4

      - name: Clone device tree
        run: |
          cd lineage
          git clone https://github.com/LineageOS/android_device_mainline_generic \
            device/mainline/generic

      - name: Build ROM
        run: |
          cd lineage
          source build/envsetup.sh
          lunch lineage_Generic_arm64-userdebug
          m bacon -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineage-mainline
          path: |
            lineage/out/target/product/**/*.zip
            lineage/out/target/product/**/*.img
